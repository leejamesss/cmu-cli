name: Offline core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check --no-cache .
      - run: python -m ruff format --no-cache --check .
      - run: python scripts/release_check.py --links-only
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Fresh wheel smoke outside checkout
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, tempfile, venv
          checkout = pathlib.Path.cwd()
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              venv.create(root / 'env', with_pip=True)
              python = root / 'env/bin/python'
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheel), 'pytest', 'jsonschema'], check=True)
              environment = {k: v for k, v in os.environ.items() if k not in ('PYTHONPATH', 'PYTHONHOME') and not k.startswith('CMU_CLI_')}
              (root / 'empty-home').mkdir()
              environment['HOME'] = str(root / 'empty-home')
              for args in [['--help'], ['--version'], ['demo', '--json'], ['config', 'init'], ['--config', 'cmu-cli.json', 'config', 'validate', '--json'], ['--config', 'cmu-cli.json', 'doctor', '--json']]:
                  subprocess.run([str(python), '-m', 'cmu_cli', *args], cwd=root, env=environment, check=True)
              shutil.copytree(checkout / 'tests', root / 'tests')
              shutil.copytree(checkout / 'docs', root / 'docs')
              subprocess.run([str(python), '-c', 'import cmu_cli; assert "site-packages" in cmu_cli.__file__'], cwd=root, env=environment, check=True)
              subprocess.run([str(python), '-m', 'pytest', '-q', 'tests'], cwd=root, env=environment, check=True)
