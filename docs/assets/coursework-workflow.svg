<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
  <title id="title">Less tab switching. One coursework CLI.</title>
  <desc id="desc">Canvas, Piazza, Gradescope, Ed Discussion and SIO connect to cmu-cli provider-specific read commands. Results are available in the terminal or versioned JSON; Canvas sync also produces local materials and indexes. Each provider needs authorization. Ed live accounts and SIO authenticated HTTP remain unverified.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
    .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
    .c-gray rect { fill: #ffffff; stroke: #888780; stroke-width: .5; }
    .c-purple rect { fill: #18181b; stroke: #18181b; stroke-width: .5; }
    .c-purple .th { fill: #ffffff; }
    .c-purple .ts { fill: #18181b; }
    .c-teal rect { fill: #fafafa; stroke: #a1a1aa; stroke-width: .5; }
    .c-teal .th { fill: #27272a; }
    .c-teal .ts { fill: #a1a1aa; }
    .arr { fill: none; stroke: #888780; stroke-width: 1; }
    .partial { stroke-dasharray: 4 4; }
  </style>
  <rect class="bg" width="680" height="430"/>
  <text class="th" x="40" y="42">Your platforms</text>
  <text class="th" x="260" y="42">One CLI</text>
  <text class="th" x="440" y="42">Your workflow</text>

  <g class="c-gray">
    <rect x="40" y="80" width="160" height="56" rx="3"/>
    <text class="th" x="120" y="108" text-anchor="middle" dominant-baseline="central">Canvas</text>
    <rect x="40" y="148" width="160" height="56" rx="3"/>
    <text class="th" x="120" y="176" text-anchor="middle" dominant-baseline="central">Piazza</text>
    <rect x="40" y="216" width="160" height="56" rx="3"/>
    <text class="th" x="120" y="244" text-anchor="middle" dominant-baseline="central">Gradescope</text>
    <rect x="40" y="284" width="160" height="56" rx="3"/>
    <text class="th" x="120" y="312" text-anchor="middle" dominant-baseline="central">Ed Discussion</text>
    <rect x="40" y="352" width="160" height="56" rx="3"/>
    <text class="th" x="120" y="380" text-anchor="middle" dominant-baseline="central">SIO</text>
  </g>
  <path class="arr" d="M200 108H226V244M200 176H226M200 244H250" marker-end="url(#arrow)"/>
  <path class="arr partial" d="M200 312H226V244M200 380H226V312"/>
  <g class="c-purple">
    <rect x="260" y="216" width="120" height="56" rx="3"/>
    <text style="font-family: monospace; font-weight: 600" class="th" x="320" y="244" text-anchor="middle" dominant-baseline="central">cmu-cli</text>
  </g>
  <path class="arr" d="M380 244H408V176H430" marker-end="url(#arrow)"/>
  <path class="arr" d="M408 244H430" marker-end="url(#arrow)"/>
  <path class="arr" d="M408 244V312H430" marker-end="url(#arrow)"/>
  <g class="c-teal">
    <rect x="440" y="148" width="200" height="56" rx="3"/>
    <text class="th" x="540" y="176" text-anchor="middle" dominant-baseline="central">Terminal output</text>
    <rect x="440" y="216" width="200" height="56" rx="3"/>
    <text class="th" x="540" y="244" text-anchor="middle" dominant-baseline="central">Versioned JSON</text>
    <rect x="440" y="284" width="200" height="56" rx="3"/>
    <text class="th" x="540" y="312" text-anchor="middle" dominant-baseline="central">Local materials</text>
  </g>
</svg>
