<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="cmu-cli">
  <title>cmu-cli</title>
  <defs>
    <clipPath id="r"><rect x="8" y="8" width="144" height="144" rx="30"/></clipPath>
  </defs>
  <!-- Tartan-inspired ground. An original mark: no university logo, seal,
       wordmark or mascot is used or implied. -->
  <g clip-path="url(#r)">
    <rect x="8" y="8" width="144" height="144" fill="#8C0D22"/>
    <g fill="#C41230">
      <rect x="8" y="30" width="144" height="18"/>
      <rect x="8" y="92" width="144" height="18"/>
      <rect x="30" y="8" width="18" height="144"/>
      <rect x="92" y="8" width="18" height="144"/>
    </g>
    <g stroke="#F2C14E" stroke-width="3" opacity="0.85">
      <line x1="8" y1="66" x2="152" y2="66"/>
      <line x1="8" y1="128" x2="152" y2="128"/>
      <line x1="66" y1="8" x2="66" y2="152"/>
      <line x1="128" y1="8" x2="128" y2="152"/>
    </g>
    <rect x="8" y="8" width="144" height="144" fill="#000" opacity="0.28"/>
  </g>
  <rect x="8" y="8" width="144" height="144" rx="30" fill="none" stroke="#F5F5F5" stroke-width="5" opacity="0.9"/>
  <!-- Terminal prompt -->
  <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="50,58 78,80 50,102"/>
    <line x1="90" y1="104" x2="118" y2="104"/>
  </g>
</svg>
